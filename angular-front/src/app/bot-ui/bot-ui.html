
<div class="p-3">
  <div class="card-body">
    <input [(ngModel)]="query" (keyup.enter)="askAgentStream()" type="text" class="form-control m-2"
           placeholder="Ex : Quels sont les comptes du client 1 ?" style="display: inline;width: 80%">
    <button (click)="askAgentStream()" class="btn btn-primary" style="display: inline" [disabled]="streaming()">
      <i class="bi bi-search"></i>
    </button>
  </div>

  <!-- reponse en streaming (askAgentStream) -->
  @if (streaming() || streamResponse()){
    <div class="card m-2">
      <div class="card-body" style="white-space: pre-wrap">
        @if (streamResponse()){
          {{streamResponse()}}
        } @else {
          <span class="text-muted">Le bot reflechit...</span>
        }
        @if (streaming()){
          <span class="spinner-grow spinner-grow-sm text-primary ms-1" role="status"></span>
        }
      </div>
    </div>
  }

  <!-- reponse complete en une fois (askAgent) -->
  @if (response$){
    @if (response$ | async; as response){
      <div class="card m-2">
        <div class="card-body" style="white-space: pre-wrap">{{response}}</div>
      </div>
    } @else {
      <div class="m-2 text-muted">Le bot reflechit (20 s a 1 min)...</div>
    }
  }
</div>
